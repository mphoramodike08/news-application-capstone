{% extends "newsapp/base.html" %}
{% block title %}Register | News Application{% endblock %}
{% block content %}
<section class="card form-card auth-card">
    <div class="section-heading">
        <p class="eyebrow">Create account</p>
        <h2>Register</h2>
        <p class="muted">Create your account, then sign in to access your role-specific dashboard.</p>
    </div>
    <form method="post" class="styled-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button button-primary">Create Account</button>
    </form>
</section>
{% endblock %}
